name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Public repository — GitHub-hosted runners are free here, unlike the private
# career-ops monorepo this is mirrored from (which is billing-blocked on
# hosted minutes and runs its own CI on self-hosted hardware instead).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The discovery node's tests import js-yaml, this package's one runtime
      # dependency, at the version package-lock.json pins. No install scripts.
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node tests/run.mjs
